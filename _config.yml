# site settings
title: Grajska.si
subtitle: My place of zen
email: tom@grajska.si
form_endpoint: /your/form # Formspree generated endpoint
description: Here's my eclectic mix of astro and landscape photography,<br />  motorcycle videos, music, programming and other DIY projects.
baseurl: "" # the subpath of your site, e.g. /blog
url: https://grajska.si # the base hostname & protocol for your site
author: Tomaž Orač
# street_address: 1234 Somewhere Road
# city:
# state:
# zip_code:
# country:
# phone:

# homepage tiles
tiles-source: pages # accepts "posts" or "pages"
tiles-count: 4

# social settings (key must match name of font awesome icon)
# see https://fontawesome.com/icons?d=gallery&p=2&s=brands
# Icons are not shown if value is empty
# You need to restart jekyll for changes to have an effect
socials:
  GitHub: https://github.com/tomorac
#  GitLab:
#  Google-Plus:
#  Instagram:
  LinkedIn: https://www.linkedin.com/in/tomaz-orac
#  Twitter:
#  Facebook:
#  Slack:

# build settings
markdown: kramdown

plugins:
  - jekyll-gallery-generator

sass:
  style: compressed

exclude:
- "*.gemspec"
- LICENSE.md
- CONTRIBUTING.md
- README.md 

# Gallery plugin options
gallery:
  dir: photos               # Path to the gallery
  symlink: false            # false: copy images into _site. true: create symbolic links (saves disk space)
  title: "Photos"           # Title for gallery index page
  title_prefix: ""          # Title prefix for gallery pages. Gallery title = title_prefix + gallery_name
  sort_field: "date_time"   # How to sort galleries on the index page.
                            # Possible values are: title, date_time, best_image
  thumbnail_size:
    x: 400                  # max width of thumbnails (in pixels)
    y: 400                  # max height of thumbnails (in pixels)
  # The following options are for individual galleries.
#  galleries:
